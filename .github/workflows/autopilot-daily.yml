name: Autopilot Daily Close

# الإقفال اليومي 23:00 بتوقيت السعودية (20:00 UTC) — بديل Vercel Cron
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch: {}

concurrency:
  group: autopilot-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger daily close on Render
        # السرّ عبر env لا داخل النص (يمنع حقن السكربت) ثم يُنظَّف من أي سطر جديد:
        # سرّ مخزَّن بسطر جديد لاحق يجعل ترويسة Authorization غير صالحة → curl(43) وفشل صامت
        # (كان يُفشل كل إقفال يومي مجدول منذ 16 يوليو 2026).
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '\r\n')"
          if [ -z "$SECRET" ]; then echo "::error::CRON_SECRET فارغ في أسرار المستودع"; exit 1; fi
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" --max-time 180 -X GET \
            -H "Authorization: Bearer $SECRET" \
            "https://portfolio-hrbz.onrender.com/portfolio/api/binance/autopilot/daily")
          echo "HTTP $code"; cat /tmp/out.json; echo
          test "$code" = "200"
