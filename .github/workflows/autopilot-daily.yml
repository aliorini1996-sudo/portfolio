name: Autopilot Daily Close

# الإقفال اليومي 23:00 بتوقيت السعودية (20:00 UTC) — بديل Vercel Cron
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch: {}

concurrency:
  group: autopilot-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger daily close on Render
        # POST بـ x-autopilot-secret: هو ما يقبله المسار فعلياً على Render (AUTOPILOT_SECRET).
        # (مسار GET يطلب CRON_SECRET غير المضبوط على Render.) السرّ عبر env ويُنظَّف من أي سطر جديد —
        # كان سرّ بسطر لاحق يُفشل كل إقفال يومي مجدول منذ 16 يوليو 2026 بـ curl(43) صامتاً.
        env:
          AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
        run: |
          SECRET="$(printf '%s' "$AUTOPILOT_SECRET" | tr -d '\r\n')"
          if [ -z "$SECRET" ]; then
            echo "::error::سرّ النبضة غير مضبوط في أسرار المستودع — أضِفه بنفس قيمته على Render"
            exit 1
          fi
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" --max-time 180 -X POST \
            -H "x-autopilot-secret: $SECRET" \
            "https://portfolio-hrbz.onrender.com/portfolio/api/binance/autopilot/daily")
          echo "HTTP $code"; cat /tmp/out.json; echo
          test "$code" = "200"
